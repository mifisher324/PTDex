{% extends "layout.html" %}
{% block title %}PTDex :: Tradeskill Search{% endblock %}
{% block body %}
<style>
  .wp-filters { display:flex; flex-wrap:wrap; gap:0.875rem 1.375rem; margin-top:1.125rem; max-width:40rem; }
  .wp-filters label { display:flex; flex-direction:column; gap:0.3125rem; font-family:var(--w-mono); font-size:.72rem;
    letter-spacing:.06em; text-transform:uppercase; color:var(--w-muted); }
  .wp-filters select, .wp-filters input[type=number] { background:var(--w-panel2); border:1px solid var(--w-line2);
    color:var(--w-text); border-radius:0.5rem; padding:0.5rem 0.6875rem; font-size:.9rem; min-width:9.375rem; }
  .wp-filters select:focus, .wp-filters input:focus { outline:none; border-color:var(--w-arc); }
  .wp-filters .chk { flex-direction:row; align-items:center; gap:0.5rem; text-transform:none; color:var(--w-text); font-size:.85rem; }
</style>
<div class="wp">
  <div class="wp-eyebrow">PTDex // world.tradeskills</div>
  <h1>Tradeskill Search</h1>
  <form action="{{ url_for('tradeskills.tradeskill_search') }}" method="post">
    <div class="wp-search" style="max-width:640px">
      <input type="text" name="tradeskill_name" placeholder="Recipe / item name (partial allowed)..." autofocus>
      <button type="submit">Search</button>
    </div>
    <div class="wp-filters">
      <label>Tradeskill
        <select name="tradeskill">
          <option value="None" selected>All Tradeskills</option>
          <option value="59">Alchemy</option><option value="60">Baking</option>
          <option value="63">Blacksmithing</option><option value="65">Brewing</option>
          <option value="64">Fletching</option><option value="68">Jewelcrafting</option>
          <option value="56">Poison Making</option><option value="69">Pottery</option>
          <option value="58">Research</option><option value="61">Tailoring</option>
          <option value="57">Tinkering</option><option value="75">Non-Tradeskill</option>
        </select>
      </label>
      <label>Trivial Min <input type="number" name="trivial_min" min="0" max="500" value="0"></label>
      <label>Trivial Max <input type="number" name="trivial" min="0" max="999" value="999"></label>
      <label class="chk"><input type="checkbox" name="no_fail" value="True"> Remove No-Fail</label>
    </div>
  </form>
</div>
{% endblock %}
