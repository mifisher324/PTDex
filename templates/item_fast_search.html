{% extends "layout.html" %}
{% block body %}
<script>
window.onload = doStuff;

function doStuff() {
    var form = document.getElementById("demoForm");
    form.addEventListener('keypress', (event) => {
        if (event.key === 'Enter') {
            event.preventDefault(); // Prevent default form submission
            form.submit(); // Manually submit the form
        }
    });
}
</script>
<script>
$(document).ready(function() {

    $('textarea').keypress(function(event) {

        if (event.keyCode == 13) {
            event.preventDefault();
        }
    });
});
</script>
<div class="srch">
<div class="srch-head"><p class="srch-eyebrow">Items</p><h1>Item Search</h1></div>
<form action="{{ url_for('items.item_fast_search') }}" method="post" class="add-entry" id="demoForm">
    <table>
        <tr>
            <td align="right">Item Name (partial allowed):</td>
            <td><input type="text" class="nameentry" name="item_name" onKeyPress="return checkSubmit(event)">
            </td>
        </tr>
        <tr>
            <td align="right"><abbr
                    title="Setting Tradeskill will cause search to ignore all other settings except name, and will automatically exclude glamours">Tradeskill
                Only: </abbr></td>
            <td><input type="checkbox" name="tradeskill" value="True"></td>
        </tr>
        <tr>
            <td align="right">Equippable Items Only:</td>
            <td><input type="checkbox" name="equippable" value="True"></td>
        </tr>
        <tr>
            <td align="right">Item Quality Type:</td>
            <td><input type="radio" checked="checked" name="itype" value="Base"> Base <input type="radio" name="itype"
                                                                                             value="Enchanted">
                Enchanted <input type="radio" name="itype" value="Legendary"> Legendary
            </td>
        </tr>
        <tr>
            <td align="right">Exclude Glamours:</td>
            <td><input type="checkbox" name="no_glamour" value="True"></td>
        </tr>
        <tr>
            <td align="right">Only Augments:</td>
            <td><input type="checkbox" name="only_aug" value="True"></td>
        </tr>
        <tr>
            <td align="right">Containers (bags):</td>
            <td><input type="checkbox" name="containers" value="True">
                &nbsp;at least <select name="min_bagslots"><option value="0">any</option><option value="4">4</option><option value="6">6</option><option value="8">8</option><option value="10">10</option><option value="12">12</option><option value="16">16</option><option value="20">20</option></select> slots</td>
        </tr>
        <tr>
            <td align="right">Slot:</td>
            <td><select name="slot"><option value="">any</option><option value="charm">Charm</option><option value="ear">Ear</option><option value="head">Head</option><option value="face">Face</option><option value="neck">Neck</option><option value="shoulders">Shoulders</option><option value="arms">Arms</option><option value="back">Back</option><option value="wrist">Wrist</option><option value="range">Range</option><option value="hands">Hands</option><option value="primary">Primary</option><option value="secondary">Secondary</option><option value="fingers">Fingers</option><option value="chest">Chest</option><option value="legs">Legs</option><option value="feet">Feet</option><option value="waist">Waist</option><option value="powersource">Power Source</option><option value="ammo">Ammo</option></select></td>
        </tr>
        <tr>
            <td align="right">Class:</td>
            <td><select name="player_class"><option value="">any</option><option value="WAR">WAR</option><option value="CLR">CLR</option><option value="PAL">PAL</option><option value="RNG">RNG</option><option value="SHD">SHD</option><option value="DRU">DRU</option><option value="MNK">MNK</option><option value="BRD">BRD</option><option value="ROG">ROG</option><option value="SHM">SHM</option><option value="NEC">NEC</option><option value="WIZ">WIZ</option><option value="MAG">MAG</option><option value="ENC">ENC</option><option value="BST">BST</option><option value="BER">BER</option></select></td>
        </tr>
    </table>
    <br>
    <input type="submit" value="Search">
</form>
</div>
{% endblock %}
